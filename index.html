<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peachy Keen 🍑</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="instructions">
        🍑 Swipe over the peach to smack it! Or use hand tracking! 🍑
    </div>
    
    <div id="rage-meter-container">
        <div id="rage-meter-fill"></div>
        <div id="rage-meter-label">🍑 PEACH-O-METER 🍑</div>
    </div>
    
    <div id="hand-cursor">🤚</div>

    <button id="oil-button">💧 Oil Up</button>
    <button id="hand-tracking-button">👋 Enable Hand Tracking</button>
    <button id="visualization-button" style="display: none;">👁️ Toggle Debug View</button>

    <!-- Hand Tracking Status -->
    <div id="hand-tracking-status" style="display: none;">
        <div id="hand-status-text">No hands detected</div>
    </div>
    
    <!-- Sound Enable Overlay -->
    <div id="sound-overlay">
        <!-- Loading items (shown during asset loading) -->
        <div id="loading-items">
            <div class="peach-emoji">🍑</div>
            <div class="title">Peachy Keen</div>
            <div class="status">
                <span id="loading-status">Loading...</span>
            </div>
            <div class="progress-bar">
                <div id="loading-progress"></div>
            </div>
        </div>
        
        <!-- Click to start (shown after loading) -->
        <div id="sound-overlay-content" style="display: none;">
            <p>Click anywhere to start</p>
        </div>
    </div>
    
    <script type="module" src="/main.js"></script>
</body>
</html>
